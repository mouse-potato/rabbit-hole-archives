[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rabbit-hole-engine"
version = "0.1.0"
description = "Deterministic detective mechanics for Bunnyland"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    # Pinned upstream Bunnyland revision used by the ECS integration tests.
    # See docs/bunnyland-integration.md for the pin rationale and AGPL note.
    "bunnyland @ git+https://github.com/thalismind/bunnyland-server@87824d3c56a32ad91c522dbc242939b11592af05",
]

[project.entry-points."bunnyland.plugins"]
# Discovered by bunnyland's plugin loader; opt in with `bunnyland serve --plugin bunnyland.archives`.
archives = "bunnyland_archives:archive_plugin"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/engine/src/rabbit_hole_engine",
    "packages/plugin/src/bunnyland_archives",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/engine/src", "packages/plugin/src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
