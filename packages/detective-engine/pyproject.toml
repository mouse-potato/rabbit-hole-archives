[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rabbit-hole-detective-engine"
version = "0.0.1"
description = "Deterministic detective mechanics for Rabbit Hole Archives"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/detective_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
