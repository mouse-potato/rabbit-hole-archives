name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - run: uv python install 3.12
      # Also installs the pinned upstream Bunnyland revision from the lockfile.
      - run: uv sync --locked --python 3.12
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy packages/engine/src packages/plugin/src tests
